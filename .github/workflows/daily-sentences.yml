# 하루 다섯 문장 — ROADMAP 1단계.
#
# 매일 새벽에 Claude 를 한 번 돌려 연습 문장을 만들고 저장소에 넣는다.
# 운영자의 구독 한도로 돌아가므로 비용이 들지 않는다 (유료 API 를 쓰지 않는다).
#
# 준비: 저장소 Settings → Secrets → Actions 에 CLAUDE_CODE_OAUTH_TOKEN 을 넣는다.
#       PC 에서 `claude setup-token` 으로 발급받는다.
#
# 참고: 정해진 시각에 도는 워크플로는 기본 브랜치(main)에 있는 것만 돈다.
#       저장소가 60일 동안 조용하면 깃허브가 예약을 꺼 버린다 (메일로 먼저 알려 준다).
#       이 워크플로가 매일 올리는 것은 그 활동에 안 쳐 주므로, 오래 쉬었다 돌아오면
#       Actions 화면에서 예약이 켜져 있는지 한 번 본다.
#       그리고 claude-code-action 은 일부러 쓰지 않는다 — 예약 실행에서 권한 문제가
#       보고된 적이 있어(issue #814) CLI 를 직접 부른다.

name: 하루 다섯 문장

on:
  schedule:
    # UTC 20:23 = 한국 05:23. 정각을 피한다 — 깃허브는 정각에 예약이 몰려서
    # 그때 걸어 두면 늦게 돌거나 아예 걸러진다. 새벽이라 몇 분 늦어도 상관없다
    - cron: '23 20 * * *'
  workflow_dispatch:        # 버튼으로 지금 바로 돌릴 수도 있다

permissions:
  contents: write

concurrency:
  group: daily-sentences
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: 문장 만들기
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -u
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN 이 없습니다."
            echo "저장소 Settings → Secrets and variables → Actions 에 넣어 주세요."
            exit 1
          fi

          # 줄 서 있던 실행은 대기를 시작한 시점의 상태를 체크아웃한다.
          # 그대로 두면 앞 실행이 이미 올린 묶음 번호를 또 만들어 올릴 때 부딪힌다 —
          # 실제로 겪었다 (s015~s017 이 두 번 만들어졌다). 최신 상태로 맞추고 시작한다
          if git fetch origin "${GITHUB_REF_NAME}"; then
            git reset --hard "origin/${GITHUB_REF_NAME}"
            echo "최신 상태에서 시작합니다: $(git log --oneline -1)"
          else
            # 못 받아 와도 만드는 것은 계속한다. 올릴 때 다시 맞춘다
            echo "최신 상태를 받아 오지 못했습니다. 체크아웃된 상태로 만듭니다."
          fi
          mkdir -p /tmp/saved

          node tools/daily_schema.js > /tmp/schema.json
          node tools/daily_aloud_schema.js > /tmp/aloud_schema.json
          node tools/daily_alts_schema.js > /tmp/alts_schema.json
          node tools/daily_korean_schema.js > /tmp/korean_schema.json
          node tools/daily_review_schema.js > /tmp/review_schema.json

          # 어떤 모델로 돌지는 data/daily/config.json 에서 정한다.
          # 못 박아 두어야 어느 날 문장이 달라졌을 때 모델 탓인지 아닌지 알 수 있다.
          MODEL=$(node -e "process.stdout.write(String(require('./tools/daily').config().model||''))")
          MODEL_ARG=""
          if [ -n "$MODEL" ]; then
            echo "-- ${MODEL} 을 쓸 수 있는지 확인합니다"
            if claude -p "ok" --model "$MODEL" --output-format json > /tmp/probe.json 2>/dev/null \
               && node tools/daily_model.js /tmp/probe.json > /dev/null; then
              MODEL_ARG="--model $MODEL"
              echo "   ${MODEL} 로 돌립니다."
            else
              # 조용히 넘어가면 안 된다. 기본 모델로 도는 사실을 기록에 남긴다
              echo "   ${MODEL} 을 쓰지 못했습니다. 기본 모델로 돌립니다."
              echo "   (구독 상태나 config.json 의 model 값을 확인해 주세요.)"
            fi
          fi

          # 실제로 답한 모델을 기록에 남긴다.
          # 못 박은 것과 실제로 답한 것이 다를 수 있으므로 호출마다 적는다
          said() {
            m=$(node tools/daily_model.js "$1" 2>/dev/null) || m=""
            if [ -z "$m" ]; then m="알 수 없음"; fi
            printf '%s' "$m"
          }

          # 영어만 떼어 소리내어 읽힌다. 한국어도 상황도 안 보여 준다 —
          # 같이 주면 "번역이 맞느냐" 를 보게 되어 어색한 영어가 그대로 통과한다.
          # 검수는 볼 것이 열 가지쯤 되어 자연스러움이 그 안에 묻힌다.
          #
          # 두 번 부른다. 한 번만 부르면 "걸리는 데 없음" 으로 그냥 넘어가는 일이 잦았다
          # (세 묶음 중 두 번). 두 번째는 첫 번째가 봤다는 것을 모르는 새 눈이라
          # "아까 괜찮다고 했으니" 가 생기지 않는다. 회차마다 무엇을 고쳤는지 기록에 남긴다.
          # 읽을 것을 못 만들거나 끼우지 못하면 앞 단계 것을 그대로 쓴다
          # 한 단계를 부른다: 지시문 만들기 → claude → 끼우기.
          # 어느 하나라도 안 되면 앞 단계 것을 그대로 쓴다 —
          # 반쯤 붙은 것을 내보내느니 앞 단계에서 멈추는 편이 낫다
          #   step <이름> <prompt 스크립트> <schema 파일> <merge 스크립트>
          step() {
            echo "-- $1"
            if ! node "$2" /tmp/polished.json > /tmp/step.txt; then
              echo "   지시문을 만들지 못해 건너뜁니다."
              return 0
            fi
            claude -p "$(cat /tmp/step.txt)" \
              $MODEL_ARG \
              --permission-mode dontAsk \
              --output-format json \
              --json-schema "$(cat $3)" \
              > /tmp/step_out.json || true
            echo "   답한 모델: $(said /tmp/step_out.json)"
            if node "$4" /tmp/polished.json /tmp/step_out.json > /tmp/step_merged.json; then
              mv /tmp/step_merged.json /tmp/polished.json
            fi
            return 0
          }

          # 하루에 여러 묶음을 만들어 둔다. 다섯 개를 다 한 사람이 앱에서 바로
          # 다음 묶음을 꺼내 쓸 수 있게 — 앱은 서버가 없어 스스로 만들지 못한다.
          BATCHES=$(node -e "process.stdout.write(String(require('./tools/daily').config().batches||1))")
          echo "묶음 ${BATCHES}개를 만듭니다."
          MADE=0

          for batch in $(seq 1 "$BATCHES"); do
          # 앞 묶음이 저장된 뒤에 지시문을 만들어야 상황이 겹치지 않는다.
          # 고른 상황은 따로 남긴다 — 만드는 단계는 영어만 내므로 뒤에서 짝지어야 한다
          node tools/daily_prompt.js /tmp/situations.json > /tmp/prompt.txt

          # 단어 수나 표현 오용처럼 형식으로 못 막는 조건이 있어서, 걸리면 다시 만들어 본다
          for try in 1 2 3; do
            echo "=== ${batch}번째 묶음 / ${try}번째 시도 ==="

            # 1) 영어만 만든다. 한국어는 여기 없다 (운영자 결정)
            echo "-- 영어를 만드는 중"
            claude -p "$(cat /tmp/prompt.txt)" \
              $MODEL_ARG \
              --permission-mode dontAsk \
              --output-format json \
              --json-schema "$(cat /tmp/schema.json)" \
              > /tmp/draft.json || true
            echo "   답한 모델: $(said /tmp/draft.json)"

            if ! node tools/daily_english_start.js /tmp/draft.json /tmp/situations.json \
                 > /tmp/polished.json; then
              echo "영어를 받지 못해 다시 만듭니다."
              continue
            fi

            # 2·3) 영어만 놓고 소리내어 읽힌다. 두 번 읽는다
            step "소리내어 읽는 중 (1번째)" tools/daily_aloud_prompt.js \
              /tmp/aloud_schema.json tools/daily_aloud_merge.js
            step "소리내어 읽는 중 (2번째)" tools/daily_aloud_prompt.js \
              /tmp/aloud_schema.json tools/daily_aloud_merge.js

            # 4) 확정된 영어에서 말투만 바꾼다. 여기도 영어만 다룬다
            step "말투를 바꾸는 중" tools/daily_alts_prompt.js \
              /tmp/alts_schema.json tools/daily_alts_merge.js

            # 5) 제일 마지막에 한국어를 붙인다. 영어는 이미 확정됐다
            step "한국어를 붙이는 중" tools/daily_korean_prompt.js \
              /tmp/korean_schema.json tools/daily_korean_merge.js

            # 한 번 만든 것을 그대로 내보내면 틀린 관용구가 그대로 나간다.
            # 다시 읽혀서 고친 것을 내보낸다 (구독 한도로 도므로 값은 안 든다)
            echo "-- 검수 중"
            if node tools/daily_review_prompt.js /tmp/polished.json > /tmp/review.txt; then
              claude -p "$(cat /tmp/review.txt)" \
                $MODEL_ARG \
                --permission-mode dontAsk \
                --output-format json \
                --json-schema "$(cat /tmp/review_schema.json)" \
                > /tmp/out.json || true
              echo "   답한 모델: $(said /tmp/out.json)"
            else
              echo "검수 지시문을 만들지 못해 건너뜁니다."
              cp /tmp/polished.json /tmp/out.json
            fi

            APPEND=""
            [ "$MADE" -gt 0 ] && APPEND="--append"

            if node tools/daily_save.js /tmp/out.json $APPEND; then
              cp /tmp/out.json "/tmp/saved/${batch}.json"
              MADE=$((MADE + 1))
              break
            fi

            # 검수본이 조건에 안 맞으면 검수 전 것이라도 되는지 본다
            echo "-- 검수본이 조건에 맞지 않아 검수 전 것을 확인합니다"
            if node tools/daily_save.js /tmp/polished.json $APPEND; then
              cp /tmp/polished.json "/tmp/saved/${batch}.json"
              MADE=$((MADE + 1))
              break
            fi
            echo "조건에 맞지 않아 다시 만듭니다."
          done
          done

          if [ "$MADE" -eq 0 ]; then
            echo "조건에 맞는 문장을 하나도 얻지 못했습니다."
            exit 1
          fi
          echo "묶음 ${MADE}개를 저장했습니다."

          # 첫 묶음은 지시문을 미리 만들어 둔 것을 쓴다
          true

      - name: 영상 대사 고르기
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DAILY_LINES: /tmp/lines.json
        # 자막이 없으면 이 단계는 그냥 건너뛴다. 앞 단계 문장은 이미 저장됐다
        continue-on-error: true
        run: |
          set -u
          if ! node tools/daily_shows_prompt.js > /tmp/shows.txt; then
            echo "쓸 만한 대사가 없어 건너뜁니다. PC 에서 자막을 등록해 주세요."
            exit 0
          fi
          node tools/daily_shows_schema.js > /tmp/shows_schema.json

          MODEL=$(node -e "process.stdout.write(String(require('./tools/daily').config().model||''))")
          MODEL_ARG=""
          [ -n "$MODEL" ] && MODEL_ARG="--model $MODEL"

          for try in 1 2; do
            echo "=== 대사 고르기 ${try}번째 ==="
            claude -p "$(cat /tmp/shows.txt)" \
              $MODEL_ARG \
              --permission-mode dontAsk \
              --output-format json \
              --json-schema "$(cat /tmp/shows_schema.json)" \
              > /tmp/shows_out.json || true

            if node tools/daily_shows_save.js /tmp/shows_out.json /tmp/lines.json; then
              cp /tmp/shows_out.json /tmp/saved_shows.json
              echo "대사를 저장했습니다."
              exit 0
            fi
            echo "조건에 맞지 않아 다시 골라 봅니다."
          done
          echo "대사를 고르지 못했습니다. 오늘은 만든 문장만 나갑니다."

      - name: 저장소에 올리기
        env:
          DAILY_LINES: /tmp/lines.json
        run: |
          if [ -z "$(git status --porcelain data/daily)" ]; then
            echo "바뀐 것이 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for wait in 0 2 4 8 16; do
            [ "$wait" -gt 0 ] && sleep "$wait"

            git add data/daily
            git commit -q -m "하루 다섯 문장 $(TZ=Asia/Seoul date +%Y-%m-%d)" || true

            if git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              continue
            fi

            # 그 사이 다른 실행이 같은 묶음 번호를 올렸다. 되감고 새 번호로 다시 붙인다.
            # 아직 올라가지 않은 묶음이므로 번호를 바꿔도 문장카드가 가리키는 것이 없다.
            # 되감기를 안 하면 남은 재시도가 전부 "unmerged files" 로 헛돈다 — 실제로 겪었다
            echo "다른 실행과 묶음 번호가 부딪혔습니다. 새 번호로 다시 붙입니다."
            git rebase --abort || true
            git reset --hard "origin/${GITHUB_REF_NAME}"

            for one in /tmp/saved/*.json; do
              [ -e "$one" ] || continue
              node tools/daily_save.js "$one" || echo "  다시 저장하지 못한 묶음이 있습니다."
            done
            if [ -f /tmp/saved_shows.json ]; then
              node tools/daily_shows_save.js /tmp/saved_shows.json "$DAILY_LINES" || true
            fi
          done

          echo "올리지 못했습니다. 만든 문장은 이번 실행에서 사라집니다."
          echo "워크플로를 한 번 더 돌려 주세요."
          exit 1
