<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>받아쓰기 연습</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 프로필 선택 -->
<div class="screen on" id="screen-profiles">
  <div class="wrap">
    <div class="top"><h1>누가 연습하나요?</h1></div>
    <div id="profile-list"></div>
  </div>
</div>

<!-- 라이브러리 -->
<div class="screen" id="screen-library">
  <div class="wrap">
    <div class="top">
      <h1 id="library-title">목록</h1>
      <button class="small" id="change-profile">사람 바꾸기</button>
    </div>
    <div id="video-list"></div>
  </div>
</div>

<!-- 듣기 -->
<div class="screen" id="screen-listen">
  <div class="wrap">
    <div class="top">
      <button class="small" id="back-to-library">← 목록</button>
      <h1 id="listen-title">불러오는 중…</h1>
    </div>

    <div class="player-box">
      <div id="player"></div>
      <!-- 멈춰 있을 때 유튜브가 띄우는 공유·로고·관련영상을 가린다 -->
      <button class="cover" id="cover" aria-label="재생"><span>▶</span></button>
    </div>

    <div class="pos" id="position"></div>
    <div class="now" id="now"></div>

    <div class="buttons">
      <button class="primary" id="play-btn">재생</button>
      <button id="replay-btn">다시 듣기</button>
      <button id="slow-btn">0.75배속</button>
      <button class="half" id="prev-btn">이전 문장</button>
      <button class="half" id="next-btn">다음 문장</button>
    </div>

    <div class="status" id="status"></div>

    <div class="notice" id="auto-note" style="display:none;margin-top:16px;">
      이 영상은 <b>자동 자막</b>으로 만들어졌습니다. 문장이 어중간하게 끊길 수 있습니다.
    </div>

    <div class="buttons"><button id="list-btn">문장 목록</button></div>
    <div class="list-box" id="sentence-list" style="display:none;"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
